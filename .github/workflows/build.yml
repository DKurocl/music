name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      owner_key: ${{ steps.key.outputs.owner }}
      version_code: ${{ steps.version.outputs.code }}
    env:
      OWNER_KEYSTORE_PASSWORD: ${{ secrets.OWNER_KEYSTORE_PASSWORD }}
      OWNER_KEY_ALIAS: ${{ secrets.OWNER_KEY_ALIAS }}
      OWNER_KEY_PASSWORD: ${{ secrets.OWNER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Guard against an emptied source tree
        run: |
          for f in settings.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml core/playback/src/main/java/ua/olex/music/playback/PlaybackService.kt; do
            [ -f "$f" ] || { echo "::error::$f is missing; the commit replaced the source tree"; exit 1; }
          done
      - name: No en or em dashes in authored files
        run: |
          # Byte patterns, so the check does not depend on the runner's locale.
          ! grep -rIl -e $'\xe2\x80\x93' -e $'\xe2\x80\x94' --include='*.kt' --include='*.kts' --include='*.md' --include='*.xml' --include='*.toml' --include='*.yml' --exclude-dir=.agents --exclude-dir=build . \
            || { echo '::error::U+2013/U+2014 found in the files above (AGENTS.md, Rules)'; exit 1; }
      - name: Owner signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.OWNER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/owner.jks"
            echo "OWNER_KEYSTORE=$RUNNER_TEMP/owner.jks" >> "$GITHUB_ENV"
            echo "owner=true" >> "$GITHUB_OUTPUT"
            echo "Release is signed with the owner key."
          else
            echo "::notice::No OWNER_KEYSTORE_B64 secret: the APK is debug-signed and no release is published."
          fi
      - name: Version code
        id: version
        run: echo "code=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Use preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.9.1
          # GitHub scopes branch caches separately; reuse new test dependencies on this branch.
          cache-read-only: false
      - name: Test, lint and build
        run: |
          set -o pipefail
          # Robolectric runs API 35 until it supports 37; shipped APKs keep minSdk 37.
          { gradle test -PminSdk=35 --no-daemon &&
            gradle :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon;
          } 2>&1 | tee build.log || {
            grep -E '^e: |error:|ERROR:|What went wrong' -A2 build.log | head -60 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::$l"
            done
            exit 1
          }
      - name: Verify the signature
        if: steps.key.outputs.owner == 'true'
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'SHA-256' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summarize test evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = set()
          executions = failures = errors = skipped = 0
          for report in Path('.').glob('**/build/test-results/**/TEST-*.xml'):
              suite = ET.parse(report).getroot()
              executions += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0))
              skipped += int(suite.get('skipped', 0))
              for case in suite.findall('testcase'):
                  cases.add((case.get('classname'), case.get('name')))
          summary = f'{len(cases)} distinct test cases; {executions} executions across build variants; {failures} failures; {errors} errors; {skipped} skipped.'
          if executions == 0:
              summary = 'No test reports were produced. Test execution is not verified.'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n' + summary + '\n\nRobolectric: API 35. APK: minSdk 37. Physical-device and visual gates are not covered by these tests.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Music-checks
          path: |
            **/build/reports/
            **/build/test-results/
            build.log
      - uses: actions/upload-artifact@v4
        with:
          name: Music-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Music-install
          path: app/build/outputs/apk/release/*.apk
  release:
    # Every main build signed with the owner key becomes a release that Obtainium installs.
    # A build signed with a throwaway key is never published: it could not update the installed app.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.owner_key == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Music-install
          path: apk
      - name: Name the APK
        run: mv apk/*.apk "apk/music-v${{ needs.build.outputs.version_code }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: music-v${{ needs.build.outputs.version_code }}
          name: music-v${{ needs.build.outputs.version_code }}
          target_commitish: ${{ github.sha }}
          files: apk/*.apk
          make_latest: true
          body: |
            Commit ${{ github.sha }}.

            Verified in CI: unit tests and Robolectric API 35 interaction checks, debug/release lint,
            R8 release build, and owner-key signature verification. APK minSdk: 37.

            Not verified by this workflow: physical Pixel/earbud playback, API 37 runtime behavior,
            reviewed screenshot goldens, automated accessibility, cold start/background measurements,
            baseline profiles, or installation through Obtainium. See docs/PHONE_CHECK.md.

            Obtainium: add this repository as a GitHub source with the title filter ^music-.
